name: Daily AI News Automator

on:
  schedule:
    # Cú pháp cron: '0 0 * * *' tương đương 00:00 giờ UTC (Tức 7:00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy thử thủ công bất cứ lúc nào

jobs:
  run-pipeline:
    runs-on: ubuntu-latest # Cấp phát một máy chủ ảo Ubuntu miễn phí
    
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        
      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Cài đặt các thư viện (Langflow, Feedparser, Requests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Kích hoạt luồng AI
        env:
          # Bơm các biến bảo mật từ GitHub Secrets vào môi trường cho Langflow đọc
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
